# Global Gradle settings. GRADLE_USER_HOME points here (see ~/.config/env/lang.env).

# Resolve jvmToolchain(N) from the mise-managed JDKs exported by lang.env
# instead of letting Gradle download a second copy of every JDK.
org.gradle.java.installations.fromEnv=JAVA_HOME_17,JAVA_HOME_21
org.gradle.java.installations.auto-download=false

# Android builds are large; these apply to every project on this host.
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
